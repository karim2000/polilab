<script>
(()=>{
const S=(es,ca)=>({es,ca});
const data=[
 {p:'2x³ − 5x² + 3x + 4',coeffs:[2,-5,3,4],root:2,level:1,qs:[
  {q:S('a) ¿Cuál es el residuo al dividir entre (x − 2), mediante Ruffini?','a) Quin és el residu de dividir entre (x − 2), mitjançant Ruffini?'),ans:6,rt:2,h:S('En Ruffini usamos 2, no −2.','A Ruffini usam 2, no −2.'),ex:'P(2) = 16 − 20 + 6 + 4 = 6.'},
  {q:S('b) Calcula P(2) con el teorema del residuo.','b) Calcula P(2) amb el teorema del residu.'),ans:6,rt:2,ex:'P(2) = 16 − 20 + 6 + 4 = 6.'},
  {q:S('c) ¿Coinciden los dos métodos?','c) Coincideixen els dos mètodes?'),type:'yn',ans:'yes',ex:S('Sí. El teorema del residuo y Ruffini deben dar el mismo resto.','Sí. El teorema del residu i Ruffini han de donar el mateix residu.')} ]},
 {p:'3x³ + 2x² − 7x + 5',coeffs:[3,2,-7,5],root:-2,level:1,qs:[
  {q:S('a) Residuo entre (x + 2), mediante Ruffini.','a) Residu entre (x + 2), mitjançant Ruffini.'),ans:3,rt:-2,ex:'P(−2) = −24 + 8 + 14 + 5 = 3.'},
  {q:S('b) Valor numérico P(−2).','b) Valor numèric P(−2).'),ans:3,rt:-2,ex:'P(−2) = 3.'},
  {q:S('c) ¿Coinciden los resultados?','c) Coincideixen els resultats?'),type:'yn',ans:'yes',ex:S('El residuo de Ruffini es el valor del polinomio en −2.','El residu de Ruffini és el valor del polinomi en −2.')} ]},
 {p:'x³ − 4x² + x + 6',coeffs:[1,-4,1,6],root:2,level:1,qs:[
  {q:S('a) Residuo entre (x − 2).','a) Residu entre (x − 2).'),ans:0,rt:2,ex:'P(2) = 8 − 16 + 2 + 6 = 0.'},
  {q:S('b) ¿Es exacta la división por (x − 2)?','b) És exacta la divisió per (x − 2)?'),type:'yn',ans:'yes',rt:2,ex:S('Sí, porque el residuo vale 0.','Sí, perquè el residu és 0.')},
  {q:S('c) ¿Es divisible entre (x + 1)?','c) És divisible entre (x + 1)?'),type:'yn',ans:'yes',rt:-1,ex:'P(−1) = −1 − 4 − 1 + 6 = 0.'},
  {q:S('d) Comprueba: ¿cuál es el resto de Ruffini con −1?','d) Comprova: quin és el residu de Ruffini amb −1?'),ans:0,rt:-1,ex:'P(−1) = 0.'} ]},
 {p:'2x⁴ − 3x³ + 5x² − 4x + 6',coeffs:[2,-3,5,-4,6],root:1,level:2,qs:[
  {q:S('a) Residuo entre (x − 1).','a) Residu entre (x − 1).'),ans:6,rt:1,ex:'P(1) = 2 − 3 + 5 − 4 + 6 = 6.'},
  {q:S('b) Residuo entre (x + 2).','b) Residu entre (x + 2).'),ans:90,rt:-2,ex:'P(−2) = 32 + 24 + 20 + 8 + 6 = 90.'},
  {q:S('c) ¿Dan Ruffini y evaluación idénticos residuos?','c) Donen Ruffini i l’avaluació residus idèntics?'),type:'yn',ans:'yes',rt:-2,ex:S('En ambos casos, sí. Puedes desplegar las dos tablas de Ruffini.','En tots dos casos, sí. Pots desplegar les dues taules de Ruffini.')},
  {q:S('d) ¿Qué divisor produce el residuo mayor?','d) Quin divisor dona el residu més gran?'),type:'choice',options:[['x − 1','a'],['x + 2','b']],ans:'b',ex:'90 > 6.'} ]},
 {p:'x³ − 2x² − 5x + 6',coeffs:[1,-2,-5,6],root:1,level:2,qs:[
  {q:S('a1) Calcula P(1).','a1) Calcula P(1).'),ans:0,rt:1,ex:'P(1) = 1 − 2 − 5 + 6 = 0.'},
  {q:S('a2) Calcula P(−1).','a2) Calcula P(−1).'),ans:8,rt:-1,ex:'P(−1) = −1 − 2 + 5 + 6 = 8.'},
  {q:S('a3) Calcula P(2).','a3) Calcula P(2).'),ans:-4,rt:2,ex:'P(2) = 8 − 8 − 10 + 6 = −4.'},
  {q:S('a4) Calcula P(3).','a4) Calcula P(3).'),ans:0,rt:3,ex:'P(3) = 27 − 18 − 15 + 6 = 0.'},
  {q:S('b) ¿Es exacta la división entre (x − 1)?','b) És exacta la divisió entre (x − 1)?'),type:'yn',ans:'yes',rt:1,ex:'P(1)=0.'},
  {q:S('c) ¿Es exacta la división entre (x − 3)?','c) És exacta la divisió entre (x − 3)?'),type:'yn',ans:'yes',rt:3,ex:'P(3)=0.'},
  {q:S('d) ¿Es exacta la división entre (x + 1)?','d) És exacta la divisió entre (x + 1)?'),type:'yn',ans:'no',rt:-1,ex:'P(−1)=8 ≠ 0.'} ]},
 {p:'−2x⁴ + 3x³ − 5x² + 7x − 4',coeffs:[-2,3,-5,7,-4],root:-3,level:2,qs:[
  {q:S('a) Residuo entre (x + 3).','a) Residu entre (x + 3).'),ans:-313,rt:-3,ex:'P(−3) = −162 − 81 − 45 − 21 − 4 = −313.'},
  {q:S('b) Comprueba mediante Ruffini. ¿Cuál es el residuo?','b) Comprova mitjançant Ruffini. Quin és el residu?'),ans:-313,rt:-3,ex:'P(−3) = −313.'},
  {q:S('c) Residuo entre (x − 2).','c) Residu entre (x − 2).'),ans:-18,rt:2,ex:'P(2) = −32 + 24 − 20 + 14 − 4 = −18.'},
  {q:S('d) ¿Es exacta alguna de las dos divisiones?','d) És exacta alguna de les dues divisions?'),type:'yn',ans:'no',ex:S('No. Ninguno de los dos residuos es cero.','No. Cap dels dos residus no és zero.')} ]},
 {p:'2x³ + kx² − 5x + 3',coeffs:[2,0,-5,3],root:2,level:3,condition:S('El residuo entre (x − 2) es 9.','El residu entre (x − 2) és 9.'),qs:[
  {q:S('a) ¿Cuánto vale k?','a) Quant val k?'),ans:0,rt:2,ex:'P(2)=16+4k−10+3=9 ⇒ 4k=0 ⇒ k=0.'},
  {q:S('b) Con ese k, ¿qué resto da Ruffini con 2?','b) Amb aquest k, quin residu dona Ruffini amb 2?'),ans:9,rt:2,ex:'P(2) = 9.'} ]},
 {p:'3x³ − 2x² + mx − 8',coeffs:[3,-2,-20,-8],root:-2,level:3,condition:S('La división entre (x + 2) es exacta.','La divisió entre (x + 2) és exacta.'),qs:[
  {q:S('a) Para que sea exacta, ¿qué debe valer P(−2)?','a) Perquè sigui exacta, quant ha de valer P(−2)?'),ans:0,rt:-2,ex:S('Una división exacta tiene residuo cero.','Una divisió exacta té residu zero.')},
  {q:S('b) ¿Cuánto vale m?','b) Quant val m?'),ans:-20,rt:-2,ex:'−24 − 8 − 2m − 8 = 0 ⇒ −40 − 2m = 0 ⇒ m = −20.'},
  {q:S('c) Comprueba Ruffini. ¿Qué resto obtienes?','c) Comprova Ruffini. Quin residu obtens?'),ans:0,rt:-2,ex:'P(−2) = 0.'} ]},
 {p:'2x⁴ + kx³ − 3x² + 4kx + 5',coeffs:[2,11/8,-3,11/2,5],root:2,level:3,condition:S('El residuo entre (x − 2) es 47.','El residu entre (x − 2) és 47.'),qs:[
  {q:S('a) Calcula k. Aceptamos fracciones como 11/8.','a) Calcula k. Acceptam fraccions com 11/8.'),ans:11/8,rt:2,ex:'P(2) = 25 + 16k = 47 ⇒ 16k = 22 ⇒ k = 11/8.'},
  {q:S('b) Sustituye k. ¿Qué vale P(2)?','b) Substitueix k. Quant val P(2)?'),ans:47,rt:2,ex:'25 + 16·(11/8) = 47.'},
  {q:S('c) Comprueba Ruffini. ¿Cuál es el residuo?','c) Comprova Ruffini. Quin és el residu?'),ans:47,rt:2,ex:'P(2)=47.'},
  {q:S('d) Residuo entre (x + 1).','d) Residu entre (x + 1).'),ans:-23/8,rt:-1,ex:'P(−1) = 4 − 5k = 4 − 55/8 = −23/8.'} ]}
];
const key='polilab_2026_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
let state={lang:saved.lang||'ca',dark:!!saved.dark,tab:'home',lesson:0,answers:saved.answers||{},tries:saved.tries||{},wrong:saved.wrong||{},revealed:{},hints:{},choice:{},inputs:{},random:null,randomText:'',toast:''};
if(state.dark)document.body.classList.add('dark');
const t=v=>typeof v==='string'?v:(v?.[state.lang]||v?.es||'');
const T=(es,ca)=>state.lang==='ca'?ca:es;
function save(){try{localStorage.setItem(key,JSON.stringify({lang:state.lang,dark:state.dark,answers:state.answers,tries:state.tries,wrong:state.wrong}))}catch{}}
const value=s=>{if(typeof s==='number')return s;let v=String(s??'').replace(/\s+/g,'').replace(',','.');if(!v)return NaN;if(/^[+-]?\d+(\.\d+)?\/[+-]?\d+(\.\d+)?$/.test(v)){let[a,b]=v.split('/').map(Number);return b===0?NaN:a/b;}return /^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(v)?Number(v):NaN};
function fmt(x){if(Math.abs(x-Math.round(x))<1e-9)return String(Math.round(x));for(let d=2;d<=64;d++){let n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){const gcd=(a,b)=>b?gcd(b,a%b):a;let g=gcd(Math.abs(n),d);return n/g+'/'+d/g}}return x.toFixed(3)}
function ev(co,a){return co.reduce((v,c)=>v*a+c,0)}
function ruffini(co,a){let row=[co[0]],mult=[null];for(let i=1;i<co.length;i++){mult.push(row[i-1]*a);row.push(co[i]+row[i-1]*a)}return {row,mult}}
function completed(id){const qs=data[id].qs;return qs.every((q,j)=>state.answers[id+'_'+j]===true)}
const ccount=()=>data.filter((_,i)=>completed(i)).length;
const allAnswered=()=>Object.values(state.answers).filter(Boolean).length;
const errcount=()=>Object.keys(state.wrong).filter(k=>state.wrong[k]>0).length;
const uid=(i,j)=>i+'_'+j;
function btn(label,handler,cls=''){return `<button class="btn ${cls}" data-act="${handler}">${label}</button>`}
function header(){return `<header class="top"><div class="brand" role="banner"><div class="brandmark"><span>∑</span></div>PoliLab</div><div class="topright"><button class="pill" data-act="lang" aria-label="Idioma">${state.lang==='ca'?'ES':'CAT'}</button><button class="iconbtn" data-act="dark" title="${T('Cambiar tema','Canviar tema')}" aria-label="Cambiar tema">${state.dark?'☀':'☾'}</button><button class="btn primary" data-act="share">↗ <span class="share-label">${T('Compartir','Compartir')}</span></button></div></header>`}
function tabs(){return `<nav class="tabs" aria-label="Menú"><button class="${state.tab==='home'?'active':''}" data-tab="home">⌂ ${T('Inicio','Inici')}</button><button class="${state.tab==='learn'?'active':''}" data-tab="learn">✦ ${T('Aprender','Aprendre')}</button><button class="${state.tab==='practice'?'active':''}" data-tab="practice">✎ ${T('Practicar','Practicar')}</button><button class="${state.tab==='review'?'active':''}" data-tab="review">↻ ${T('Repasar','Repassar')}</button></nav>`}
function home(){let c=ccount();return `<section class="hero"><span class="eyebrow">${T('Laboratorio de matemáticas · ESO','Laboratori de matemàtiques · ESO')}</span><h1>${T('El residuo deja de ser un misterio.','El residu deixa de ser un misteri.')}</h1><p>${T('Aprende Ruffini, practica con 9 retos reales y recibe pistas según tus errores.','Aprèn Ruffini, practica amb 9 reptes reals i rep pistes segons les teves errades.')}</p><div class="flex">${btn(T(c?'Continuar practicando':'Empezar ahora',c?'Continuar practicant':'Començar ara'),'start','coral')}${btn(T('Ver la teoría','Veure la teoria'),'learn','ghost')}</div></section><div class="cols"><div class="card"><div class="heading"><h2>${T('Tu ruta de aprendizaje','La teva ruta d’aprenentatge')}</h2><span class="tag">${c}/9 ${T('completados','completats')}</span></div><div class="progress-track" role="progressbar" aria-valuenow="${c}" aria-valuemin="0" aria-valuemax="9"><div class="progress-fill" style="width:${100*c/9}%"></div></div><p class="muted mini">${T('Escoge un ejercicio. La aplicación recordará tu avance en este dispositivo.','Tria un exercici. L’aplicació recordarà el teu progrés en aquest dispositiu.')}</p><div class="navgrid">${data.map((d,i)=>`<button class="lesson-btn ${completed(i)?'done':''}" data-open="${i}"><strong>${completed(i)?'✓ ':''}${String(i+1).padStart(2,'0')}</strong><small>${[T('Básico','Bàsic'),T('Aplicación','Aplicació'),T('Reto','Repte')][d.level-1]}</small></button>`).join('')}</div></div><aside class="card"><h3>${T('Aprender sin miedo','Aprendre sense por')}</h3><div class="topscore"><div><b class="kpi">${c}</b><div class="mini muted">${T('Retos','Reptes')}</div></div><div><b class="kpi">${allAnswered()}</b><div class="mini muted">${T('Aciertos','Encerts')}</div></div><div><b class="kpi">${errcount()}</b><div class="mini muted">${T('Revisar','Revisar')}</div></div></div><p>${T('Tu tutor te orienta sin mostrar la respuesta de inmediato.','El teu tutor t’orienta sense mostrar la resposta immediatament.')}</p>${btn(T('Compartir actividad','Compartir activitat'),'share','soft')}<p class="mini muted">${T('Sin cuenta. Datos guardados solo en tu dispositivo.','Sense compte. Dades desades només al teu dispositiu.')}</p></aside></div>`}
function theory(){return `<div class="heading workspace"><h2>${T('Aprende el método','Aprèn el mètode')}</h2><span class="tag">3 ${T('ideas clave','idees clau')}</span></div><div class="cols"><section class="card"><h3>01 · ${T('Teorema del residuo','Teorema del residu')}</h3><p>${T('Al dividir P(x) entre (x − a), el residuo es P(a). Sustituyes x por a y calculas.','Quan dividim P(x) entre (x − a), el residu és P(a). Substitueixes x per a i calcules.')}</p><div class="equation">R = P(a)</div><p>${T('Ejemplo: P(x) = x² − 4. Entre (x − 2), P(2) = 4 − 4 = 0.','Exemple: P(x) = x² − 4. Entre (x − 2), P(2) = 4 − 4 = 0.')}</p><div class="callout"><b>${T('La trampa del signo','El parany del signe')}:</b> ${T('(x + 2) significa a = −2, no +2.','(x + 2) significa a = −2, no +2.')}</div><h3>02 · Ruffini</h3><p>${T('Escribe todos los coeficientes en orden. Baja el primero, multiplícalo por a, suma y repite. El último número es el residuo.','Escriu tots els coeficients en ordre. Baixa el primer, multiplica’l per a, suma i repeteix. El darrer nombre és el residu.')}</p>${renderRuffini(data[0].coeffs,2)}<h3>03 · ${T('División exacta','Divisió exacta')}</h3><div class="equation">P(a) = 0 ⇔ (x − a) ${T('es divisor','és divisor')}</div><p>${T('Si el residuo es cero, la división es exacta.','Si el residu és zero, la divisió és exacta.')}</p>${btn(T('Ir a los ejercicios','Anar als exercicis'),'start','primary')}</section><aside class="card"><h3>${T('Mini calculadora','Mini calculadora')}</h3><p class="muted mini">${T('Elige un polinomio de la ficha y prueba un valor a.','Tria un polinomi de la fitxa i prova un valor a.')}</p><label class="mini">${T('Ejercicio','Exercici')}</label><select class="answer" id="calc-poly" style="width:100%">${data.map((d,i)=>`<option value="${i}" ${i===(state.calcId||0)?'selected':''}>${i+1}. ${d.p}</option>`).join('')}</select><p><label class="mini">${T('Valor a','Valor a')}</label></p><input id="calc-a" class="answer" value="${state.calcA??2}" inputmode="decimal" aria-label="a"> <button class="btn soft" data-act="calc">${T('Calcular','Calcular')}</button><div id="calc-result" aria-live="polite">${state.calcOut||''}</div></aside></div>`}
function renderRuffini(co,a){const r=ruffini(co,a);return `<div style="overflow-x:auto"><table class="ruffini" aria-label="Ruffini"><tr><td rowspan="2">${fmt(a)}</td>${co.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr><tr>${r.mult.map(x=>`<td>${x===null?'↓':fmt(x)}</td>`).join('')}</tr><tr><td></td>${r.row.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr></table></div><p class="muted mini" style="text-align:center">${T('Último número = residuo','Darrer nombre = residu')} = <b>${fmt(r.row.at(-1))}</b></p>`}
function classify(q,guess){if(q.type==='yn')return T('Revisa qué significa que el residuo sea cero.','Revisa què significa que el residu sigui zero.');if(q.rt!==undefined && Math.abs(guess-ev(data[state.lesson].coeffs,-q.rt))<1e-8 && q.rt!==0){return T('Atención al signo: en (x − a), sustituimos x = a. Con (x + 2), a = −2.','Atenció al signe: a (x − a), substituïm x = a. Amb (x + 2), a = −2.')}if(Number.isFinite(guess) && Math.abs(guess+q.ans)<1e-8 && q.ans!==0)return T('Parece que has cambiado el signo del resultado. Comprueba las sumas.','Sembla que has canviat el signe del resultat. Comprova les sumes.');return T('Revisa los signos, las potencias y las operaciones. Puedes pedir una pista.','Revisa els signes, les potències i les operacions. Pots demanar una pista.')}
function exercise(){let i=state.lesson,d=data[i],num=Object.keys(state.answers).filter(k=>k.startsWith(i+'_')&&state.answers[k]).length;return `<section class="workspace"><div class="heading"><div><span class="tag">${[T('Fundamentos','Fonaments'),T('Aplicación','Aplicació'),T('Desafío','Desafiament')][d.level-1]} · ${T('Ejercicio','Exercici')} ${i+1} / 9</span><h2 style="margin:12px 0 0">${T('Resuelve paso a paso','Resol pas a pas')}</h2></div><button class="btn ghost" data-tab="home">← ${T('Índice','Índex')}</button></div><div class="card"><p class="muted mini">${T('Dado el polinomio','Donat el polinomi')}:</p><div class="equation">P(x) = ${d.p}</div>${d.condition?`<div class="callout">${t(d.condition)}</div>`:''}<p class="muted mini">${num} / ${d.qs.length} ${T('apartados correctos','apartats correctes')}</p><div class="progress-track"><div class="progress-fill" style="width:${100*num/d.qs.length}%"></div></div>${d.qs.map((q,j)=>renderQ(d,i,q,j)).join('')}<div class="footer-nav"><button class="btn" data-move="-1" ${i===0?'disabled':''}>← ${T('Anterior','Anterior')}</button><button class="btn primary" data-move="1" ${i===8?'disabled':''}>${T('Siguiente','Següent')} →</button></div></div></section>`}
function renderQ(d,i,q,j){let k=uid(i,j),ok=state.answers[k],tr=state.tries[k]||0,chosen=state.choice[k]||'',v=state.inputs[k]||'',ex=q.ex?`<p>${t(q.ex)}</p>`:'';const choices=q.type==='yn'?[[T('Sí','Sí'),'yes'],[T('No','No'),'no']]:q.options||[];return `<div class="question" id="q-${i}-${j}"><div class="question-head"><span class="qletter">${j+1}</span><span>${t(q.q)} ${ok?'<span class="check">✓</span>':''}</span></div>${choices.length?`<div class="choice-row">${choices.map(([label,a])=>`<button class="choice ${chosen===a?'active':''}" data-choice="${k}|${a}" aria-pressed="${chosen===a}">${label}</button>`).join('')}</div>`:`<div class="answer-area"><input class="answer" inputmode="decimal" aria-label="${T('Respuesta','Resposta')}" placeholder="${T('Tu respuesta','La teva resposta')}" value="${v.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" data-input="${k}"></div>`}<div class="practice-bar"><button class="btn primary" data-check="${i}|${j}" ${ok?'disabled':''}>${ok?'✓ '+T('Correcto','Correcte'):T('Comprobar','Comprovar')}</button><button class="btn soft" data-hint="${k}">✦ ${T('Pista','Pista')}</button>${q.rt!==undefined?`<button class="btn" data-ruffini="${k}">⊞ Ruffini</button>`:''}${tr>=2?`<button class="btn" data-solution="${k}">${T('Ver solución','Veure solució')}</button>`:''}</div>${state.hints[k]?`<div class="hint"><b>✦ ${T('Pista','Pista')}:</b> ${q.h?t(q.h):q.rt!==undefined?T('¿Qué valor hay que sustituir por x? Prueba x = '+fmt(q.rt)+'.','Quin valor has de substituir per x? Prova x = '+fmt(q.rt)+'.'):T('Piensa si el residuo debe ser cero para que la división sea exacta.','Pensa si el residu ha de ser zero perquè la divisió sigui exacta.')}</div>`:''}${state.revealed[k+'r']&&q.rt!==undefined?renderRuffini(d.coeffs,q.rt):''}${state.revealed[k+'s']?`<div class="hint"><b>${T('Solución explicada','Solució explicada')}:</b> ${ex}</div>`:''}${state.revealed[k+'f']?`<div class="feedback ${ok?'':'wrong'}" role="status"><b>${ok?'✓ '+T('Muy bien','Molt bé'):'↻ '+T('Vuelve a intentarlo','Torna-ho a provar')}</b> · ${ok?T('¡Lo has conseguido!','Ho has aconseguit!'):state.revealed[k+'msg']||classify(q,NaN)}${ok?ex:''}</div>`:''}</div>`}
function review(){let w=Object.keys(state.wrong).filter(k=>state.wrong[k]>0);return `<section class="workspace"><div class="heading"><h2>${T('Tu progreso y repaso','El teu progrés i repàs')}</h2><span class="tag">${ccount()} / 9</span></div><div class="cols"><div class="card"><div class="topscore"><div><div class="kpi">${ccount()}</div><div class="mini muted">${T('Ejercicios','Exercicis')}</div></div><div><div class="kpi">${allAnswered()}</div><div class="mini muted">${T('Apartados','Apartats')}</div></div><div><div class="kpi">${errcount()}</div><div class="mini muted">${T('Dificultades','Dificultats')}</div></div></div><h3 style="margin-top:24px">${T('A repasar','Per repassar')}</h3>${w.length?w.map(k=>{let[i,j]=k.split('_').map(Number);return `<div class="review-item"><b>${T('Ejercicio','Exercici')} ${i+1}, ${T('apartado','apartat')} ${j+1}</b> · ${state.wrong[k]} ${T('errores','errades')} ${state.answers[k]?'✓':''}<div><button class="btn soft" data-open="${i}">${T('Repasar','Repassar')} →</button></div></div>`}).join(''):`<p class="muted">${T('Todavía no hay errores registrados. ¡Empieza a practicar!','Encara no hi ha errades registrades. Comença a practicar!')}</p>`}<div class="flex" style="margin-top:20px">${btn(T('Compartir mi progreso','Compartir el meu progrés'),'share-progress','primary')}${btn(T('Reiniciar progreso','Reiniciar el progrés'),'reset','ghost')}</div></div><aside class="card"><h3>${T('Reto sorpresa','Repte sorpresa')}</h3><p class="muted">${T('Practica con un polinomio nuevo generado al azar y corregido automáticamente.','Practica amb un polinomi nou generat aleatòriament i corregit automàticament.')}</p>${btn(T('Generar ejercicio','Generar exercici'),'random','soft')}<div id="random-box">${randomBox()}</div></aside></div></section>`}
function randomBox(){if(!state.random)return '';let z=state.random;return `<div class="callout"><b>P(x) = ${z.p}</b><p>${T('Residuo entre','Residu entre')} (x ${z.a<0?'+ '+(-z.a):'− '+z.a}):</p><input class="answer" id="random-answer" inputmode="decimal" value="${state.randomText}" placeholder="?"> <button class="btn primary" data-act="random-check">${T('Comprobar','Comprovar')}</button>${state.randomResult?`<p class="mini"><b>${state.randomResult}</b></p>`:''}</div>`}
function makeRandom(){let deg=3,co=Array.from({length:4},(_,i)=>(Math.floor(Math.random()*11)-5));if(co[0]===0)co[0]=2;let a=Math.floor(Math.random()*7)-3;let names=['x³','x²','x',''];let p=co.map((c,i)=>{let ab=Math.abs(c),expr=(ab===1&&i!==3?'':ab)+names[i];return (i===0?(c<0?'−':''):c<0?' − ':' + ')+expr}).join('');state.random={p,co,a,ans:ev(co,a)};state.randomText='';state.randomResult='';}
function app(){document.getElementById('app').innerHTML=header()+tabs()+(state.tab==='home'?home():state.tab==='learn'?theory():state.tab==='practice'?exercise():review())+`<p class="notice">PoliLab · ${T('Sin registro ni seguimiento externo. Los resultados se guardan solo en tu dispositivo.','Sense registre ni seguiment extern. Els resultats es guarden només al teu dispositiu.')}</p>`;document.documentElement.lang=state.lang;}
function check(i,j){let q=data[i].qs[j],k=uid(i,j),ans=q.type?(state.choice[k]||''):value(state.inputs[k]||''),correct=q.type?ans===q.ans:Number.isFinite(ans)&&Math.abs(ans-q.ans)<1e-7;if(q.type&&ans==='')return;if(!q.type&&!Number.isFinite(ans))return;state.tries[k]=(state.tries[k]||0)+1;state.revealed[k+'f']=true;state.revealed[k+'msg']=classify(q,ans);if(correct){state.answers[k]=true;}else state.wrong[k]=(state.wrong[k]||0)+1;save();let oldId=`q-${i}-${j}`;app();document.getElementById(oldId)?.scrollIntoView({block:'center',behavior:'smooth'});}
function share(progress){let text=progress?T('Estoy practicando Ruffini con PoliLab: '+ccount()+'/9 ejercicios completos.','Estic practicant Ruffini amb PoliLab: '+ccount()+'/9 exercicis complets.') : T('Practica Ruffini y el teorema del residuo con esta app gratuita.','Practica Ruffini i el teorema del residu amb aquesta app gratuïta.');let url=location.href.startsWith('file:')?'':location.href;if(navigator.share){navigator.share({title:'PoliLab',text,url:url||undefined}).catch(()=>{});return}let msg=text+(url?' '+url:'');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(()=>alert(T('Texto y enlace copiados.','Text i enllaç copiats.'))).catch(()=>prompt(T('Copia y comparte','Copia i comparteix'),msg))}else prompt(T('Copia y comparte','Copia i comparteix'),msg)}
document.addEventListener('input',e=>{if(e.target.matches('[data-input]')){state.inputs[e.target.dataset.input]=e.target.value;}if(e.target.id==='random-answer')state.randomText=e.target.value;});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;app();scrollTo(0,0);return}if(b.dataset.open!==undefined){state.lesson=Number(b.dataset.open);state.tab='practice';app();scrollTo(0,0);return}if(b.dataset.move!==undefined){state.lesson=Math.max(0,Math.min(8,state.lesson+Number(b.dataset.move)));app();scrollTo(0,0);return}if(b.dataset.choice){let[k,v]=b.dataset.choice.split('|');state.choice[k]=v;app();return}if(b.dataset.check){let[i,j]=b.dataset.check.split('|').map(Number);check(i,j);return}if(b.dataset.hint){state.hints[b.dataset.hint]=!state.hints[b.dataset.hint];app();return}if(b.dataset.ruffini){let k=b.dataset.ruffini+'r';state.revealed[k]=!state.revealed[k];app();return}if(b.dataset.solution){state.revealed[b.dataset.solution+'s']=true;app();return}if(b.dataset.act){switch(b.dataset.act){case'lang':state.lang=state.lang==='ca'?'es':'ca';save();app();break;case'dark':state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save();app();break;case'start':state.tab='practice';state.lesson=Math.max(0,data.findIndex((_,i)=>!completed(i)));app();scrollTo(0,0);break;case'learn':state.tab='learn';app();scrollTo(0,0);break;case'share':share(false);break;case'share-progress':share(true);break;case'reset':if(confirm(T('¿Borrar todo tu progreso?','Vols esborrar tot el progrés?'))){state.answers={};state.tries={};state.wrong={};state.revealed={};state.hints={};save();app()}break;case'random':makeRandom();app();break;case'random-check':if(state.random){const v=value(state.randomText);state.randomResult=Number.isFinite(v)&&Math.abs(v-state.random.ans)<1e-8?T('¡Correcto!','Correcte!'):T('Revisa la evaluación: P('+state.random.a+') = '+fmt(state.random.ans),'Revisa l’avaluació: P('+state.random.a+') = '+fmt(state.random.ans));app()}break;case'calc':{let select=document.getElementById('calc-poly'),id=Number(select?.value||0),a=value(document.getElementById('calc-a')?.value);if(Number.isFinite(a)){state.calcId=id;state.calcA=a;state.calcOut=`<div class="callout"><b>P(${fmt(a)}) = ${fmt(ev(data[id].coeffs,a))}</b></div>`+renderRuffini(data[id].coeffs,a)}app();break}}}});
app();
})();
</script>
</body></html>
